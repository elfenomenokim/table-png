name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) ships no 3.9 build; keep 3.9 on ubuntu-22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install CJK and emoji fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: Install
        run: python -m pip install .
      - name: Compile and render smoke check
        shell: bash
        run: |
          # No unit-test suite exists; run the documented render check on docs/demo/status.md.
          # Visual inspection of rendered glyphs, wrapping and emoji stays manual.
          python -m compileall -q src
          out="${RUNNER_TEMP:-/tmp}/table-check.png"
          table-png docs/demo/status.md --out "$out" --title "Check"
          test -s "$out"
          rm -f "$out"
